name: PR Quality

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: read

jobs:

  composition:
    name: composition
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validar composición multirepo
        run: ./tools/validate-composition.sh

  docs:
    name: docs-consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detectar referencias activas obsoletas
        shell: bash
        run: |
          files=(
            README.md
            .ai/PROJECT_CONTEXT.md
            .ai/ARCHITECTURE_SUMMARY.md
            .ai/roles/devops.md
            docs/design/DD.md
            docs/architecture/SDD.md
            docs/architecture/adr/ADR-012-stack-tecnologico-polyglot.md
            docs/governance/WORKING_AGREEMENTS.md
            docs/testing/TD.md
          )

          if grep -nE \
            'Angular 17|ASP\.NET Core 8|Java 17|Kubeval|docs/contracts|MinIO' \
            "${files[@]}"; then

            echo "::error::Hay referencias activas obsoletas."
            exit 1
          fi

  # Infraestructura (SCRUM-338: antes era el CI de quickpatch-infrastructure). Documento de Pruebas, sección 7.10.
  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color .github/workflows/*.yml

  ansible:
    name: Ansible (sintaxis y ansible-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure/ansible
    steps:
      - uses: actions/checkout@v4
      # deploy-gateway.yml y deploy-kafka.yml usan archivos de estos dos submódulos.
      - name: Submódulos del gateway y de Kafka
        working-directory: .
        run: git submodule update --init --depth 1 apps/api-gateway apps/kafka
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar Ansible y colecciones
        run: |
          pip install "ansible-core>=2.18,<2.19"
          ansible-galaxy collection install -r requirements.yml
      - name: Revisar sintaxis de todos los playbooks
        run: |
          for p in playbooks/*.yml; do
            echo "== $p"
            ansible-playbook --syntax-check "$p"
          done
      - name: ansible-lint, perfil production (INF-001)
        run: |
          pip install "ansible-lint>=25,<26"
          ansible-lint playbooks/ tasks/ ../../apps/kafka/deploy/deploy-kafka.yml

  secretos:
    name: Secretos en infrastructure/ (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (INF-009)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --redact             --log-opts="-- infrastructure .github"

  quality-gate:
    name: quality-gate
    if: always()

    needs:
      - composition
      - docs
      - workflows
      - ansible
      - secretos

    runs-on: ubuntu-latest

    steps:
      - name: Validar compuertas
        run: |
          test "${{ needs.composition.result }}" = "success"
          test "${{ needs.docs.result }}" = "success"
          test "${{ needs.workflows.result }}" = "success"
          test "${{ needs.ansible.result }}" = "success"
          test "${{ needs.secretos.result }}" = "success"
