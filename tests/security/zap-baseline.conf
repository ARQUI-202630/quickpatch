# QUICKPATCH — Configuración de Reglas OWASP ZAP Baseline (INF-013)
#
# Formato: <rule_id>\t<ACTION>\t<comment>
# Acciones disponibles:
#   FAIL   : Detiene el pipeline si se detecta la vulnerabilidad (Riesgo Alto).
#   WARN   : Emite advertencia en el reporte sin detener el build.
#   IGNORE : Ignora la regla (falsos positivos o no aplicable a APIs REST stateless).

# -----------------------------------------------------------------------------
# 1. Reglas críticas que deben romper el build (FAIL)
# -----------------------------------------------------------------------------
40018	FAIL	(SQL Injection)
40026	FAIL	(Cross Site Scripting - XSS)
40028	FAIL	(Open Redirect)
90019	FAIL	(Server Side Code Injection)
90020	FAIL	(Remote OS Command Injection)
10045	FAIL	(Source Code Disclosure)
20019	FAIL	(External Redirect)

# -----------------------------------------------------------------------------
# 2. Reglas no aplicables a APIs REST JSON / Falsos Positivos conocidos (IGNORE)
# -----------------------------------------------------------------------------
# APIs protegidas por Bearer JWT no requieren tokens Anti-CSRF basados en cookies de sesión
10202	IGNORE	(Absence of Anti-CSRF Tokens)
# Content Security Policy (CSP) aplica a contenido renderizado en navegadores HTML, no a endpoints JSON
10038	IGNORE	(Content Security Policy (CSP) Header Not Set)
# Endpoints públicos de salud (/health) o catálogos no requieren encabezados de exclusión de frame
10020	IGNORE	(Anti-clickjacking Header Not Present)
# Headers específicos de servidor informativo
10036	IGNORE	(Server Leaks Version Information via "Server" HTTP Response Header Field)

# -----------------------------------------------------------------------------
# 3. Advertencias de seguridad evaluables (WARN)
# -----------------------------------------------------------------------------
10021	WARN	(X-Content-Type-Options Header Missing)
10035	WARN	(Strict-Transport-Security Header Not Set)
10054	WARN	(Cookie Without SameSite Attribute)
10055	WARN	(CSP: script-src unsafe-inline)
10096	WARN	(Timestamp Disclosure)
10098	WARN	(Cross-Domain Misconfiguration)
