# Activa el cifrado en reposo de los Secret de Kubernetes en k3s (`secrets-encryption`, SCRUM-49) y los vuelve a cifrar.
# Por defecto solo QA (VM2); producción exige además -e ambiente=produccion -e confirmar_produccion=si.
#
#   ./ap playbooks/cifrar-secretos-k3s.yml -k -K                  solo informa (no cambia nada): estado, ayuda del comando y conteo
#   ./ap playbooks/cifrar-secretos-k3s.yml -k -K -e aplicar=si    respalda, activa, reinicia k3s, vuelve a cifrar y verifica
#
# Qué hace con aplicar=si, en orden:
#   1. Respaldo consistente del almacén de datos (SQLite de k3s, API de respaldo de sqlite3) y del token, en
#      /var/backups/k3s-<fecha>-<hora>/ (uno nuevo por corrida: repetir no pisa el respaldo anterior) con permisos 0700.
#      OJO: ese respaldo trae los Secret SIN cifrar; se borra a mano cuando ya no hace falta.
#   2. `secrets-encryption: true` en /etc/rancher/k3s/config.yaml (k3s lo lee como el flag del mismo nombre).
#   3. Reinicio de k3s. Los pods siguen corriendo (systemd solo mata el proceso principal), pero el API del clúster no responde unos
#      segundos: no correr mientras haya un despliegue en curso.
#   4. `k3s secrets-encrypt rotate-keys`: rota la llave y vuelve a escribir cifrados todos los Secret (con `rotate-keys` no hay que
#      reiniciar). En versiones sin ese subcomando usa `reencrypt`. El comando devuelve el control antes de terminar de reescribir,
#      así que el playbook espera a que `secrets-encrypt status` diga `reencrypt_finished` (hasta 5 minutos).
#   5. Verificación: el estado dice Enabled, todas las versiones vigentes de los Secret en el almacén empiezan por `k8s:enc:aescbc`
#      y el API no devuelve menos Secret que antes (puede devolver más: k3s crea tokens por su cuenta). Solo imprime conteos, nunca valores.
#
# Para volver atrás: parar k3s, restaurar state.db del respaldo, quitar `secrets-encryption` de config.yaml y arrancar k3s.
- name: Cifrar los Secret de k3s en reposo
  hosts: "{{ 'backend' if (ambiente | default('qa')) == 'produccion' else 'qa_app' }}"
  gather_facts: false
  become: true
  vars:
    k3s: /usr/local/bin/k3s
    db: /var/lib/rancher/k3s/server/db/state.db
    contar_secretos: |
      import sqlite3, sys
      c = sqlite3.connect("file:{{ db }}?mode=ro", uri=True)
      filas = c.execute("select substr(kv.value, 1, 14) from kine kv join "
                        "(select name, max(id) mid from kine where name like '/registry/secrets/%' group by name) m "
                        "on kv.id = m.mid where kv.deleted = 0").fetchall()
      cifrados = sum(1 for (v,) in filas if bytes(v).startswith(b"k8s:enc:aescbc"))
      print(len(filas), cifrados)
  pre_tasks:
    - name: Producción solo con confirmación explícita
      ansible.builtin.assert:
        that: (ambiente | default('qa')) != 'produccion' or (confirmar_produccion | default('no')) == 'si'
        fail_msg: Para producción agrega -e ambiente=produccion -e confirmar_produccion=si.
        quiet: true
  tasks:
    - name: Estado del cifrado, subcomandos disponibles y almacén de datos
      ansible.builtin.shell: |
        set -o pipefail
        {{ k3s }} --version | head -1
        echo "--- secrets-encrypt status"; {{ k3s }} secrets-encrypt status 2>&1 | head -12
        echo "--- subcomandos"; {{ k3s }} secrets-encrypt --help 2>&1 | grep -E '^\s+(status|enable|disable|rotate|rotate-keys|reencrypt|prepare)' || true
        echo "--- config.yaml"; cat /etc/rancher/k3s/config.yaml 2>/dev/null || echo "(sin archivo)"
        echo "--- almacén"; ls -lh {{ db }}*
        echo "--- espacio"; df -h /var/lib/rancher | tail -n +2
        echo "--- Secret en el almacén (total, cifrados)"
        python3 - <<'PY'
        {{ contar_secretos }}PY
      args:
        executable: /bin/bash
      register: antes
      changed_when: false

    - name: Estado antes del cambio
      ansible.builtin.debug:
        var: antes.stdout_lines

    - name: Cuántos Secret ve el API
      ansible.builtin.shell: |
        set -o pipefail
        {{ k3s }} kubectl get secrets -A --no-headers | wc -l
      args:
        executable: /bin/bash
      register: secretos_antes
      changed_when: false

    - name: Aplicar el cifrado
      when: (aplicar | default('no')) == 'si'
      block:
        - name: Carpeta del respaldo
          ansible.builtin.file:
            path: "/var/backups/k3s-{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"
            state: directory
            mode: "0700"
          register: respaldo

        - name: Respaldo consistente del almacén de datos y del token
          ansible.builtin.shell: |
            set -o pipefail
            python3 - <<'PY'
            import sqlite3
            origen = sqlite3.connect("file:{{ db }}?mode=ro", uri=True)
            destino = sqlite3.connect("{{ respaldo.path }}/state.db")
            origen.backup(destino)
            destino.close()
            PY
            cp -p /var/lib/rancher/k3s/server/token {{ respaldo.path }}/token
            chmod 0600 {{ respaldo.path }}/state.db {{ respaldo.path }}/token
            ls -l {{ respaldo.path }}
          args:
            executable: /bin/bash
          register: copia
          changed_when: true

        - name: Respaldo hecho
          ansible.builtin.debug:
            var: copia.stdout_lines

        - name: Activar secrets-encryption en el config.yaml de k3s
          ansible.builtin.lineinfile:
            path: /etc/rancher/k3s/config.yaml
            regexp: '^secrets-encryption:'
            line: "secrets-encryption: true"
            create: true
            mode: "0600"

        # Solo si k3s todavía no corre con el cifrado (así repetir la corrida no lo reinicia otra vez).
        - name: Reiniciar k3s (solo si aún no informa Enabled)
          ansible.builtin.systemd:
            name: k3s
            state: restarted
          when: "'Encryption Status: Enabled' not in antes.stdout"

        - name: Esperar a que el nodo vuelva a estar listo
          ansible.builtin.command: "{{ k3s }} kubectl wait --for=condition=Ready node --all --timeout=240s"
          register: nodo
          retries: 12
          delay: 10
          until: nodo.rc == 0
          changed_when: false

        # El nodo figura Ready antes de que el servidor de k3s acepte las llamadas de `secrets-encrypt` (/v1-k3s): sin esta espera
        # `rotate-keys` falla con EOF justo después del reinicio.
        - name: Esperar a que k3s acepte los comandos de secrets-encrypt
          ansible.builtin.command: "{{ k3s }} secrets-encrypt status"
          register: acepta
          retries: 18
          delay: 5
          until: acepta.rc == 0
          changed_when: false

        - name: Volver a cifrar los Secret con la llave nueva
          ansible.builtin.shell: |
            set -o pipefail
            if {{ k3s }} secrets-encrypt --help 2>&1 | grep -q 'rotate-keys'; then
              {{ k3s }} secrets-encrypt rotate-keys 2>&1 | tail -5
            else
              {{ k3s }} secrets-encrypt reencrypt 2>&1 | tail -5
            fi
          args:
            executable: /bin/bash
          register: reencriptar
          changed_when: true

        - name: Resultado del cifrado
          ansible.builtin.debug:
            var: reencriptar.stdout_lines

        - name: Esperar a que el API responda de nuevo
          ansible.builtin.command: "{{ k3s }} kubectl get --raw=/readyz"
          register: api
          retries: 18
          delay: 10
          until: api.rc == 0
          changed_when: false

        - name: Esperar a que k3s termine de reescribir los Secret
          ansible.builtin.shell: "{{ k3s }} secrets-encrypt status 2>&1"
          register: estado_despues
          retries: 30
          delay: 10
          until: "'reencrypt_finished' in estado_despues.stdout"
          changed_when: false

        - name: Secret en el almacén (total y cifrados)
          ansible.builtin.shell: |
            python3 - <<'PY'
            {{ contar_secretos }}PY
          register: almacen_despues
          changed_when: false

        - name: Secret que ve el API y pods de la aplicación
          ansible.builtin.shell: |
            set -o pipefail
            {{ k3s }} kubectl get secrets -A --no-headers | wc -l
            {{ k3s }} kubectl get pods -n quickpatch --no-headers | awk '{print $1,$2,$3}'
          args:
            executable: /bin/bash
          register: api_despues
          changed_when: false

        - name: Estado después del cambio
          ansible.builtin.debug:
            msg:
              - "{{ estado_despues.stdout_lines }}"
              - "Secret en el almacén (total, cifrados): {{ almacen_despues.stdout }}"
              - "Secret que ve el API: {{ api_despues.stdout_lines[0] }} (antes: {{ secretos_antes.stdout | trim }})"
              - "{{ api_despues.stdout_lines[1:] }}"

        - name: Falla si quedó algún Secret sin cifrar o el API ve menos Secret que antes
          ansible.builtin.assert:
            that:
              - "'Encryption Status: Enabled' in estado_despues.stdout"
              - almacen_despues.stdout.split()[0] == almacen_despues.stdout.split()[1]
              - almacen_despues.stdout.split()[0] | int > 0
              - api_despues.stdout_lines[0] | trim | int >= secretos_antes.stdout | trim | int
            fail_msg: Revisa la salida de arriba; el respaldo está en {{ respaldo.path }}.
            success_msg: Todos los Secret del almacén están cifrados y el API los sigue sirviendo.
